<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>For You</title>

<!-- Google Fonts (optional, with system fallbacks defined in CSS) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating ambient hearts layer (behind everything) -->
<div id="ambient-hearts" class="ambient-hearts" aria-hidden="true"></div>

<!-- Music toggle -->
<button id="music-toggle" class="music-toggle" aria-label="Play background music" aria-pressed="false">
  <svg class="icon-note" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path fill="currentColor" d="M9 18V5l12-2v13"/>
    <circle fill="currentColor" cx="6" cy="18" r="3"/>
    <circle fill="currentColor" cx="18" cy="16" r="3"/>
  </svg>
  <svg class="icon-mute" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden>
    <path fill="currentColor" d="M9 18V5l12-2v13"/>
    <circle fill="currentColor" cx="6" cy="18" r="3"/>
    <circle fill="currentColor" cx="18" cy="16" r="3"/>
    <line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2"/>
  </svg>
</button>
<audio id="bg-music" loop preload="none">
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<main id="app">

  <!-- SCREEN 1 — LANDING -->
  <section class="screen active" id="screen-landing" data-screen="landing">
    <div class="screen-inner">
      <p class="eyebrow-text">Hey You&nbsp;💌</p>
      <h1 class="display-lg">Someone has a very important question for you...</h1>
      <button class="btn btn-primary" id="btn-open-question" type="button">Open My Question</button>
    </div>
  </section>

  <!-- SCREEN 2 — THE MAIN QUESTION -->
  <section class="screen" id="screen-main-question" data-screen="main-question">
    <div class="screen-inner">
      <h1 class="display-lg" id="main-question-text">Do you love Atik Al Sabbir?</h1>
      <div class="button-row" id="yn-wrapper">
        <button class="btn btn-primary btn-yes" id="btn-yes" type="button">YES</button>
        <button class="btn btn-ghost btn-no" id="btn-no" type="button" aria-label="No">No</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 2b — YES RESPONSE -->
  <section class="screen" id="screen-yes-response" data-screen="yes-response">
    <div class="screen-inner">
      <h1 class="display-lg" id="yes-response-text">hehe... I knew it 🥰</h1>
      <p class="body-text" id="yes-response-sub">Let's see how much you love me...</p>
      <button class="btn btn-primary" id="btn-continue-questions" type="button">Continue</button>
    </div>
  </section>

  <!-- SCREEN 3 — ROMANTIC QUESTIONS -->
  <section class="screen" id="screen-questions" data-screen="questions">
    <div class="screen-inner">
      <p class="progress-label" id="question-progress" aria-hidden="true"></p>
      <h1 class="display-md" id="question-text"></h1>
      <div class="button-col" id="question-options"></div>
    </div>
  </section>

  <!-- SCREEN 4 — BUILD ANTICIPATION -->
  <section class="screen" id="screen-anticipation" data-screen="anticipation">
    <div class="screen-inner">
      <p class="body-text fade-line" id="ant-line-1">Okay...</p>
      <p class="body-text fade-line" id="ant-line-2">Since you answered all my questions...</p>
      <p class="body-text fade-line" id="ant-line-3">I think you deserve something special.</p>
      <h2 class="display-md fade-line" id="ant-line-4">Are you ready?</h2>
      <button class="btn btn-primary fade-line" id="btn-open-surprise" type="button">Open Your Surprise</button>
    </div>
  </section>

  <!-- FINAL SCREEN — LOVE LETTER -->
  <section class="screen screen-letter" id="screen-letter" data-screen="letter">
    <div class="screen-inner letter-inner">
      <div class="letter-card" id="letter-card">
        <p class="letter-heading">To My Love</p>
        <p class="letter-body" id="letter-body" aria-live="polite"></p>
        <button class="btn btn-primary letter-btn" id="btn-one-more-thing" type="button" hidden>One More Thing...</button>
      </div>
    </div>
  </section>

  <!-- CELEBRATION SCREEN -->
  <section class="screen screen-celebration" id="screen-celebration" data-screen="celebration">
    <div class="screen-inner">
      <h1 class="display-lg celebration-title">I LOVE YOU</h1>
      <p class="celebration-sub">Forever &amp; Always</p>
    </div>
  </section>

</main>

<!-- Celebration effect layers -->
<div id="celebration-layer" class="celebration-layer" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
